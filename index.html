<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="claude:viewport-fit-sides" content="cover" />
    <title>字元畫板</title>
  </head>
  <body>
    <header class="shell">
      <h1 class="brand">字元 <b>畫板</b></h1>
      <span class="meta" id="meta">0 × 0 cells</span>
    </header>

    <main class="work">
      <div id="stage">
        <div id="paper">
          <canvas id="view" aria-label="繪圖區"></canvas>
          <div id="brush" class="brush" hidden aria-hidden="true"></div>
        </div>
      </div>

      <div class="tray">
        <div class="row toprow">
          <div class="seg" role="group" aria-label="色彩模式">
            <button data-palette="color" aria-pressed="true">色彩</button>
            <button data-palette="gray" aria-pressed="false">灰階</button>
          </div>
          <button id="bUnder" class="toggle" aria-pressed="false">
            <span class="track"></span>筆跡
          </button>
          <span class="spacer"></span>
          <div class="hist">
            <button id="bUndo" class="btn-tertiary" title="復原（Ctrl+Z）" disabled>復原</button>
            <button id="bRedo" class="btn-tertiary" title="重做（Ctrl+Y）" disabled>重做</button>
          </div>
        </div>
        <div class="row colorrow">
          <div class="swatches" role="group" aria-label="筆的顏色">
            <button
              class="sw"
              data-color="#000000"
              aria-pressed="true"
              aria-label="墨色（跟隨主題）"
            >
              <i class="ink"></i>
            </button>
            <button class="sw" data-color="#da1e28" aria-pressed="false" aria-label="紅">
              <i style="background: #da1e28"></i>
            </button>
            <button class="sw" data-color="#ff832b" aria-pressed="false" aria-label="橙">
              <i style="background: #ff832b"></i>
            </button>
            <button class="sw" data-color="#f1c21b" aria-pressed="false" aria-label="黃">
              <i style="background: #f1c21b"></i>
            </button>
            <button class="sw" data-color="#24a148" aria-pressed="false" aria-label="綠">
              <i style="background: #24a148"></i>
            </button>
            <button class="sw" data-color="#009d9a" aria-pressed="false" aria-label="青">
              <i style="background: #009d9a"></i>
            </button>
            <button class="sw" data-color="#0f62fe" aria-pressed="false" aria-label="藍">
              <i style="background: #0f62fe"></i>
            </button>
            <button class="sw" data-color="#8a3ffc" aria-pressed="false" aria-label="紫">
              <i style="background: #8a3ffc"></i>
            </button>
            <label class="sw pick" for="colorPick" aria-label="自選顏色">
              <i id="pickSwatch" style="background: #ee5396"></i>
              <input id="colorPick" type="color" value="#ee5396" />
            </label>
          </div>
          <div class="seg" role="group" aria-label="工具">
            <button id="tPen" aria-pressed="true">繪製</button>
            <button id="tErase" aria-pressed="false">擦除</button>
          </div>
        </div>
        <div class="row">
          <div class="seg modes" role="group" aria-label="轉換樣式">
            <button data-mode="mix" aria-pressed="true">混合</button>
            <button data-mode="braille" aria-pressed="false">點字</button>
            <button data-mode="block" aria-pressed="false">方塊</button>
            <button data-mode="shade" aria-pressed="false">濃淡</button>
            <button data-mode="dots" aria-pressed="false">圓點</button>
            <button data-mode="cjk" aria-pressed="false">中文</button>
            <button data-mode="line" aria-pressed="false">線段</button>
            <button data-mode="custom" aria-pressed="false">自訂</button>
          </div>
        </div>
        <div class="row" id="customRow" hidden>
          <label class="label" for="customChars">字元</label>
          <input id="customChars" type="text" value=" .oO@" spellcheck="false" autocomplete="off" />
        </div>
        <div class="field">
          <label class="label" for="size">粗細</label>
          <input id="size" type="range" min="2" max="40" value="5" />
          <span class="out" id="sizeOut">5</span>
        </div>
        <div class="canvasbox">
          <button
            id="bCanvas"
            class="btn-ghost canvas-toggle"
            aria-expanded="false"
            aria-controls="canvasPanel"
          >
            <span class="label">畫布大小</span>
            <span class="canvas-summary" id="canvasSummary">自動 · 0 × 0</span>
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" />
            </svg>
          </button>
          <div id="canvasPanel" class="row" hidden>
            <button id="bAuto" class="toggle" aria-pressed="true">
              <span class="track"></span>自動
            </button>
            <label class="label" for="inCols">欄</label>
            <input
              id="inCols"
              class="num"
              type="number"
              inputmode="numeric"
              min="8"
              max="200"
              step="1"
              disabled
            />
            <label class="label" for="inRows">列</label>
            <input
              id="inRows"
              class="num"
              type="number"
              inputmode="numeric"
              min="4"
              max="100"
              step="1"
              disabled
            />
          </div>
        </div>
        <div class="row actions">
          <button id="bClear" class="btn-tertiary">清空</button>
          <span class="spacer"></span>
          <button id="bCopy" class="btn-secondary" aria-expanded="false">複製</button>
        </div>
        <div id="copyMenu" hidden>
          <div class="row has-tip">
            <span class="label tip-label"
              >空白替代<button
                id="tipBtn"
                class="info"
                aria-label="空白替代說明"
                aria-expanded="false"
                aria-controls="spaceTip"
              >
                <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                  <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" />
                  <rect x="7.4" y="7" width="1.2" height="4.5" fill="currentColor" />
                  <circle cx="8" cy="5" r=".8" fill="currentColor" />
                </svg>
              </button>
            </span>
            <div id="spaceTip" class="tip" role="tooltip" hidden>
              <p>
                <b>標準</b
                >標準的空白字元，適用於程式碼、終端機、編輯器。<br />多數聊天軟體與社群平台會吃掉開頭或連續的空白，不建議使用。
              </p>
              <p>
                <b>不斷行</b
                >特殊的空白字元，顯示上寬度和標準空白相同，比較少被裁切掉，但部分主流平台會將其轉換為一般空白，使用上請自行確認。
              </p>
              <p>
                <b>點字</b
                >盲文字元中的空白字元，被裁切掉的可能性最低，適合用於聊天、社群平台。<br />不過比例字型下寬度可能不齊，且無法在程式碼中被當成空白。
              </p>
            </div>
            <div class="seg sm" role="group" aria-label="空白字元">
              <button data-space=" " aria-pressed="false">標準</button>
              <button data-space="&#xA0;" aria-pressed="false">不斷行</button>
              <button data-space="&#x2800;" aria-pressed="true">點字</button>
            </div>
            <button id="bFence" class="toggle" aria-pressed="false">
              <span class="track"></span>``` 區塊
            </button>
          </div>
          <div class="row copyrow">
            <button data-copy="text" class="btn-secondary">純文字</button>
            <button data-copy="html" class="btn-secondary">彩色 HTML</button>
            <button data-copy="ansi" class="btn-secondary">ANSI</button>
          </div>
        </div>
      </div>
    </main>

    <div id="toast" hidden></div>
    <div id="copyPanel" hidden>
      <div class="row">
        <span class="label">剪貼簿被擋住了，長按下方文字全選複製</span><span class="spacer"></span>
        <button id="bClosePanel" class="btn-secondary">關閉</button>
      </div>
      <textarea id="copyText" readonly></textarea>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

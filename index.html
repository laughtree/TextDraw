<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta
      name="description"
      content="Text Draw：在畫布上畫圖，即時轉成點字、方塊等字元畫，可匯入圖片與文字，並複製成純文字、HTML、ANSI 或圖片。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23161616'/%3E%3Cg fill='%23fff'%3E%3Ccircle cx='10' cy='7' r='3'/%3E%3Ccircle cx='22' cy='7' r='3'/%3E%3Ccircle cx='10' cy='16' r='3'/%3E%3Ccircle cx='22' cy='16' r='3'/%3E%3Ccircle cx='10' cy='25' r='3'/%3E%3Ccircle cx='22' cy='25' r='3'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>Text Draw</title>
  </head>
  <body>
    <header class="shell">
      <h1 class="brand">Text <b>Draw</b></h1>
      <span class="meta" id="meta">0 × 0 cells</span>
    </header>

    <main class="work">
      <div id="stage">
        <div id="paper">
          <canvas id="view" aria-label="繪圖區"></canvas>
          <div id="brush" class="brush" hidden aria-hidden="true"></div>
          <div id="pickFrame" class="pick-frame" hidden aria-hidden="true">
            <i class="chip"></i>
          </div>
          <div id="textCaret" class="text-caret" hidden aria-hidden="true"></div>
          <input
            id="textEdit"
            class="text-edit"
            type="text"
            hidden
            autocomplete="off"
            spellcheck="false"
            aria-label="輸入文字，按 Enter 確定、Esc 取消"
          />
        </div>
      </div>

      <div id="tray" class="tray">
        <button
          id="sheetHandle"
          class="sheet-handle"
          aria-expanded="false"
          aria-controls="tray"
          aria-label="展開工具列"
        ></button>
        <div class="row toprow">
          <div class="seg" role="group" aria-label="色彩模式">
            <button data-palette="color" aria-pressed="true">色彩</button>
            <button data-palette="gray" aria-pressed="false">灰階</button>
          </div>
          <button id="bUnder" class="toggle" aria-pressed="false">
            <span class="track"></span>筆跡
          </button>
          <span class="spacer"></span>
          <div class="hist">
            <button id="bUndo" class="btn-tertiary" title="復原（Ctrl+Z）" disabled>復原</button>
            <button id="bRedo" class="btn-tertiary" title="重做（Ctrl+Y）" disabled>重做</button>
          </div>
        </div>
        <div class="row colorrow">
          <div class="swatches" role="group" aria-label="筆的顏色">
            <button
              class="sw"
              data-color="#000000"
              aria-pressed="true"
              aria-label="墨色（跟隨主題）"
            >
              <i class="ink"></i>
            </button>
            <button class="sw" data-color="#da1e28" aria-pressed="false" aria-label="紅">
              <i style="background: #da1e28"></i>
            </button>
            <button class="sw" data-color="#ff832b" aria-pressed="false" aria-label="橙">
              <i style="background: #ff832b"></i>
            </button>
            <button class="sw" data-color="#f1c21b" aria-pressed="false" aria-label="黃">
              <i style="background: #f1c21b"></i>
            </button>
            <button class="sw" data-color="#24a148" aria-pressed="false" aria-label="綠">
              <i style="background: #24a148"></i>
            </button>
            <button class="sw" data-color="#009d9a" aria-pressed="false" aria-label="青">
              <i style="background: #009d9a"></i>
            </button>
            <button class="sw" data-color="#0f62fe" aria-pressed="false" aria-label="藍">
              <i style="background: #0f62fe"></i>
            </button>
            <button class="sw" data-color="#8a3ffc" aria-pressed="false" aria-label="紫">
              <i style="background: #8a3ffc"></i>
            </button>
          </div>
          <div class="pair">
            <button
              class="sw eyedropper"
              data-tool="pick"
              aria-pressed="false"
              aria-label="滴管"
              title="滴管（點到字元就吸色）"
            >
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path d="M16.5 3.5l4 4-2.5 2.5-4-4 2.5-2.5zM13.5 8l-9 9L4 20l3-.5 9-9" />
              </svg>
            </button>
            <label
              class="sw pick"
              for="colorPick"
              aria-label="自選顏色（調色盤）"
              style="--pick: #ee5396"
            >
              <svg class="palette" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <path
                  class="disc"
                  d="M12 3C6.5 3 2.5 7 2.5 12s4 9 9.5 9c1.4 0 2-.9 2-1.8 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H17c2.8 0 5-2.2 5-5 0-4.5-4.5-8.8-10-8.8z"
                />
                <circle cx="7.5" cy="11.5" r="1.6" fill="#da1e28" />
                <circle cx="10.5" cy="7.3" r="1.6" fill="#f1c21b" />
                <circle cx="15.5" cy="7.3" r="1.6" fill="#24a148" />
                <circle cx="18" cy="11.5" r="1.6" fill="#0f62fe" />
              </svg>
              <input id="colorPick" type="color" value="#ee5396" />
            </label>
          </div>
        </div>
        <div class="row tools">
          <div class="seg iconseg" role="group" aria-label="形狀與文字">
            <button data-tool="pen" aria-pressed="true" aria-label="筆" title="筆（自由繪畫）">
              <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19l-4 1zM14 7l3 3" />
              </svg>
            </button>
            <button data-tool="line" aria-pressed="false" aria-label="直線" title="直線（拖曳）">
              <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <path d="M5 19L19 5" />
              </svg>
            </button>
            <button data-tool="circle" aria-pressed="false" aria-label="圓" title="圓（拖出外框）">
              <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <circle cx="12" cy="12" r="7.5" />
              </svg>
            </button>
            <button data-tool="rect" aria-pressed="false" aria-label="方" title="方（拖出外框）">
              <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <rect x="5" y="5" width="14" height="14" />
              </svg>
            </button>
            <button
              data-tool="text"
              aria-pressed="false"
              aria-label="文字"
              title="文字（點一下輸入）"
            >
              <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <path d="M6 7V5h12v2M12 5v14M9.5 19h5" />
              </svg>
            </button>
          </div>
          <div class="seg actionseg" role="group" aria-label="繪製或擦除">
            <button id="tDraw" data-action="draw" aria-pressed="true">繪製</button>
            <button id="tErase" data-action="erase" aria-pressed="false">擦除</button>
          </div>
        </div>
        <div id="textOpts" class="row textopts" hidden>
          <label class="label" for="textSize">字級</label>
          <input id="textSize" type="range" min="12" max="160" value="48" />
          <span class="out" id="textSizeOut">48</span>
        </div>
        <div class="row">
          <div class="seg modes" role="group" aria-label="轉換樣式">
            <button data-mode="braille" aria-pressed="true">點字</button>
            <button data-mode="mix" aria-pressed="false">混合</button>
            <button data-mode="block" aria-pressed="false">方塊</button>
            <button data-mode="shade" aria-pressed="false">濃淡</button>
            <button data-mode="dots" aria-pressed="false">圓點</button>
            <button data-mode="cjk" aria-pressed="false">中文</button>
            <button data-mode="line" aria-pressed="false">線段</button>
            <button data-mode="custom" aria-pressed="false">自訂</button>
          </div>
        </div>
        <div class="row" id="customRow" hidden>
          <label class="label" for="customChars">字元</label>
          <input id="customChars" type="text" value=" .oO@" spellcheck="false" autocomplete="off" />
        </div>
        <div class="field">
          <label class="label" for="size">粗細</label>
          <input id="size" type="range" min="2" max="40" value="5" />
          <span class="out" id="sizeOut">5</span>
        </div>
        <div class="canvasbox">
          <button
            id="bCanvas"
            class="btn-ghost canvas-toggle"
            aria-expanded="false"
            aria-controls="canvasPanel"
          >
            <span class="label">畫布大小</span>
            <span class="canvas-summary" id="canvasSummary">小尺寸通用 · 20 × 12</span>
            <span class="canvas-budget" id="canvasBudget" hidden></span>
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" />
            </svg>
          </button>
          <div id="canvasPanel" class="canvaspanel" hidden>
            <div class="row">
              <button id="bAuto" class="toggle" aria-pressed="false">
                <span class="track"></span>滿版
              </button>
              <label class="label" for="inCols">欄</label>
              <input
                id="inCols"
                class="num"
                type="number"
                inputmode="numeric"
                min="8"
                max="200"
                step="1"
                disabled
              />
              <label class="label" for="inRows">列</label>
              <input
                id="inRows"
                class="num"
                type="number"
                inputmode="numeric"
                min="4"
                max="100"
                step="1"
                disabled
              />
            </div>
            <div class="row has-tip">
              <label class="label" for="platform">平台</label>
              <select id="platform" class="select">
                <option value="">自訂</option>
              </select>
              <button
                id="platformTipBtn"
                class="info"
                aria-label="平台說明"
                aria-expanded="false"
                aria-controls="platformTip"
                hidden
              >
                <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                  <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" />
                  <rect x="7.4" y="7" width="1.2" height="4.5" fill="currentColor" />
                  <circle cx="8" cy="5" r=".8" fill="currentColor" />
                </svg>
              </button>
              <div id="platformTip" class="tip" role="tooltip" hidden></div>
            </div>
            <div id="budget" class="budget" hidden>
              <div class="budget-count" id="budgetCount" role="status"></div>
            </div>
          </div>
        </div>
        <div class="row actions">
          <button id="bClear" class="btn-tertiary">清空</button>
          <span class="spacer"></span>
          <button id="bImport" class="btn-secondary" aria-expanded="false" aria-label="匯入">
            匯入
          </button>
          <button id="bCopy" class="btn-secondary" aria-expanded="false" aria-label="匯出">
            匯出
          </button>
        </div>
        <div id="importMenu" hidden>
          <div class="seg modes" role="group" aria-label="匯入類型">
            <button data-import="image" aria-pressed="true">圖片</button>
            <button data-import="text" aria-pressed="false">文字</button>
          </div>
          <div id="importImagePane" class="importpane">
            <span class="label"
              >圖片完整置中畫在畫布上，保留原色；也可以把檔案拖進畫布，或直接貼上圖片。</span
            >
            <div class="row copyrow">
              <button id="bPickImage" class="btn-secondary">選擇圖片</button>
            </div>
          </div>
          <div id="importTextPane" class="importpane" hidden>
            <textarea
              id="importText"
              placeholder="貼上 ASCII art，畫布會變成文字的大小"
              spellcheck="false"
              aria-label="要匯入的文字"
            ></textarea>
            <div class="row copyrow">
              <button id="bPickText" class="btn-secondary">選擇檔案</button>
              <button id="bDoImport" class="btn-secondary">匯入</button>
            </div>
          </div>
          <input id="fileImage" type="file" accept="image/*" hidden />
          <input id="fileText" type="file" accept=".txt,.ans,text/plain" hidden />
        </div>
        <div id="copyMenu" hidden>
          <div class="row has-tip">
            <span class="label tip-label"
              >空白替代<button
                id="tipBtn"
                class="info"
                aria-label="空白替代說明"
                aria-expanded="false"
                aria-controls="spaceTip"
              >
                <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                  <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" />
                  <rect x="7.4" y="7" width="1.2" height="4.5" fill="currentColor" />
                  <circle cx="8" cy="5" r=".8" fill="currentColor" />
                </svg>
              </button>
            </span>
            <div id="spaceTip" class="tip" role="tooltip" hidden>
              <p>
                <b>標準</b
                >標準的空白字元，適用於程式碼、終端機、編輯器。<br />多數聊天軟體與社群平台會吃掉開頭或連續的空白，不建議使用。
              </p>
              <p>
                <b>不斷行</b
                >特殊的空白字元，顯示上寬度和標準空白相同，比較少被裁切掉，但部分主流平台會將其轉換為一般空白，使用上請自行確認。
              </p>
              <p>
                <b>點字</b
                >盲文字元中的空白字元，被裁切掉的可能性最低，適合用於聊天、社群平台。<br />不過比例字型下寬度可能不齊，且無法在程式碼中被當成空白。
              </p>
            </div>
            <div class="seg sm" role="group" aria-label="空白字元">
              <button data-space=" " aria-pressed="false">標準</button>
              <button data-space="&#xA0;" aria-pressed="false">不斷行</button>
              <button data-space="&#x2800;" aria-pressed="true">點字</button>
            </div>
            <button id="bFence" class="toggle" aria-pressed="false">
              <span class="track"></span>``` 區塊
            </button>
          </div>
          <div class="seg modes" role="group" aria-label="匯出格式">
            <button data-format="text" aria-pressed="true">純文字</button>
            <button data-format="html" aria-pressed="false">HTML</button>
            <button data-format="ansi" aria-pressed="false">ANSI</button>
            <button data-format="image" aria-pressed="false">圖片</button>
          </div>
          <div class="row copyrow">
            <button id="bDoCopy" class="btn-secondary">複製</button>
            <button id="bDoDownload" class="btn-secondary">下載</button>
          </div>
        </div>
      </div>
    </main>

    <div id="toast" hidden></div>
    <div id="copyPanel" hidden>
      <div class="row">
        <span class="label">剪貼簿被擋住了，長按下方文字全選複製</span><span class="spacer"></span>
        <button id="bClosePanel" class="btn-secondary">關閉</button>
      </div>
      <textarea id="copyText" readonly></textarea>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
